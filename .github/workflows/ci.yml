name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tests run entirely in-process (Node's built-in test runner). No live network
# calls, no Testnet RPC, no Telegram credentials. The scan CLI and the poller
# loop both require external services — those are verified manually with
# `npm run scan` against Testnet.
permissions:
  contents: read


# CI is deterministic: no live RPC or Telegram calls. The poller's chain
# correctness against live data is verified separately with `npm run scan`.
#
# Node version matrix:
#   20 – minimum per package.json engines (">=20"), matches Dockerfile base image
#   22 – current LTS, used in production
#   24 – newest LTS, validates forward compatibility
jobs:
  scan-secrets:
    # Secret scanning gate (issue #109). Runs before build so a leaked token
    # fails fast, without a report that could outlive the rotated secret. The
    # scanner is offline, zero-dependency and deterministic: it needs no
    # credentials and its output is always redacted (pinned by
    # tests/secrets.test.mjs, run in the build job below).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan tracked files for secret-shaped strings
        run: npm run scan:secrets

  build:
    needs: scan-secrets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # `npm ci` proves the lockfile installs; these prove it is the lockfile we
      # meant to commit: pinned to the registry, in sync with package.json, and
      # unchanged when npm regenerates it from itself.
      - name: Lockfile consistency
        run: npm run lockfile:check

      - name: Lockfile reproducibility
        run: npm run lockfile:reproduce

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (notification formats + secret-scanner properties)
        run: npm test

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
